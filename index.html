<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050508" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("lustforge-theme");
          // Dark by default; only an explicit "light" choice opts out.
          var dark = theme !== "light";
          document.documentElement.classList.toggle("dark", dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#050508" : "#f7f1ea");
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LustForge" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-icon-180.png" />
    <title>LustForge — AI Companion App for Adults 18+</title>
    <meta name="description" content="LustForge is an adults-only AI companion app. Create a fictional companion, then talk by text, pictures, and voice. 18+ only." />
    <meta name="author" content="LustForge" />
    <meta name="rating" content="adult" />
    <link rel="canonical" href="__OG_SITE_ORIGIN__/" />

    <!-- Absolute URL required for X/Facebook/Discord link previews; replace domain if you deploy elsewhere -->

    <meta property="og:description" content="An adults-only AI companion app. Create someone fictional, then talk by text, pictures, and voice. 18+ only." />

    <meta property="og:image" content="__OG_SITE_ORIGIN__/og-image.png?v=3" />
